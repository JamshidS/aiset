name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.18
      - run: ruff check src tests eval

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    # ubuntu-latest is Ubuntu 26.04 now, which has no Python 3.9 build for setup-python. Run on 24.04 but keep the
    # "ubuntu-latest" name: the master ruleset requires checks with that name.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # teammap parses TypeScript with this package; without it the TypeScript tests are skipped
      - run: npm install --no-save typescript@5.6.3
      - run: python -m compileall -q src/aiset eval tests
      - run: python -m unittest discover -s tests -v

  package:
    name: Build and smoke-test the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.2.2.post1 twine==6.1.0
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The wheel ships the templates and the dashboard
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for need in ("aiset/templates/pm.md", "aiset/static/index.html", "aiset/roster.json", "aiset/teammap_ts.js"):
              assert need in names, f"missing from wheel: {need}"
          print(f"{len(names)} files, all required ones present")
          EOF
      - name: Install the wheel and set up a team
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          mkdir -p /tmp/ws/api && cd /tmp/ws/api
          git init -q && printf 'fastapi\n' > requirements.txt
          git -c user.email=ci@example.com -c user.name=ci add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm init
          AISET_HOME=/tmp/aiset-home /tmp/venv/bin/aiset-init /tmp/ws --team smoke --no-launcher
          test -f /tmp/ws/.claude/team/roster.json
          test -f /tmp/ws/.claude/agents/pm.md
          /tmp/venv/bin/aiset --help > /dev/null
          cd /tmp/ws && /tmp/venv/bin/teammap index
